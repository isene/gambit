[package]
name = "gambit"
version = "0.3.0"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Chess against a language model in the terminal. Part of the Fe2O3 Rust terminal suite."
license = "Unlicense"
repository = "https://github.com/isene/gambit"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "2", features = ["tls", "json"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
